name: Тесты НИР

on:
  push:
    paths:
      - '06_НИР/src/**'
      - '06_НИР/tests/**'
      - '06_НИР/requirements.txt'
      - '.github/workflows/nir-tests.yml'
  pull_request:
    paths:
      - '06_НИР/src/**'
      - '06_НИР/tests/**'
      - '06_НИР/requirements.txt'
      - '.github/workflows/nir-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06_НИР
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            06_НИР/requirements.txt
            06_НИР/src/texgen/noise/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
